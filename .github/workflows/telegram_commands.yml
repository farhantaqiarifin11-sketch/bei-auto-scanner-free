
name: Telegram Commands

on:
  workflow_dispatch:

  schedule:
    # Polling Telegram setiap 10 menit
    # Senin-Jumat, pukul 07.00-15.50 WIB
    - cron: "*/10 0-8 * * 1-5"

    # Senin-Jumat, pukul 06.00-06.50 WIB
    - cron: "*/10 23 * * 0-4"

permissions:
  contents: write

concurrency:
  group: bei-auto-scanner-state
  cancel-in-progress: false

jobs:
  telegram-commands:
    name: Telegram Bot Polling
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Telegram configuration
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || (echo "TELEGRAM_BOT_TOKEN belum diatur" && exit 1)
          test -n "$TELEGRAM_CHAT_ID" || (echo "TELEGRAM_CHAT_ID belum diatur" && exit 1)

      - name: Run Telegram commands
        run: python -u bot_commands.py

      - name: Save bot state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update Telegram bot state"
            git push origin HEAD:main
          fi
