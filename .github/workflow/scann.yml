
name: BEI Auto Scanner

on:
  schedule:
    # Top 10 pukul 06.00 WIB, Senin-Jumat
    - cron: "0 23 * * 0-4"

    # Pemindaian terakhir pra-pembukaan 08.40 WIB
    - cron: "40 1 * * 1-5"

    # Pemindaian rutin setiap 20 menit
    - cron: "0,20,40 2-8 * * 1-5"

    # Momentum pukul 09.15 WIB
    - cron: "15 2 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bei-auto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Jakarta
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Ambil kode scanner
        uses: actions/checkout@v5

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instal kebutuhan
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Periksa struktur file
        run: |
          echo "Memeriksa direktori repository"
          pwd
          ls -la
          test -f scanner.py
          test -f config.json
          test -f requirements.txt

      - name: Jalankan scanner
        run: python -u scanner.py

      - name: Simpan riwayat alert
        if: success()
        run: |
          if [ -d data ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A data/
            if ! git diff --cached --quiet; then
              git commit -m "Update scanner alert state"
              git push
            fi
          fi
