
name: BEI Auto Scanner

on:
  schedule:
    # Top 10 pukul 06.00 WIB, Senin-Jumat
    - cron: "0 23 * * 0-4"

    # Pemindaian terakhir sebelum pembukaan, 08.40 WIB
    - cron: "40 1 * * 1-5"

    # Pemindaian rutin setiap 20 menit, 09.00-15.40 WIB
    - cron: "0,20,40 2-8 * * 1-5"

    # Notifikasi momentum pukul 09.15 WIB
    - cron: "15 2 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bei-auto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Jakarta
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Ambil kode scanner
        uses: actions/checkout@v5

      - name: Siapkan Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Periksa struktur repository
        run: |
          echo "=== LOKASI REPOSITORY ==="
          pwd

          echo "=== DAFTAR FILE ==="
          ls -la

          echo "=== DAFTAR WORKFLOW ==="
          ls -la .github/workflows/

          echo "=== CEK FILE UTAMA ==="
          python - <<'PY'
          import os

          files = [
              "scanner.py",
              "config.json",
              "requirements.txt"
          ]

          failed = False

          for name in files:
              exists = os.path.isfile(name)
              print(f"{name}: {'ADA' if exists else 'TIDAK ADA'}")
              if not exists:
                  failed = True

          if failed:
              raise SystemExit("Ada file wajib yang tidak ditemukan.")
          PY

      - name: Validasi konfigurasi JSON
        run: |
          python -m json.tool config.json

      - name: Instal kebutuhan
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan BEI Auto Scanner
        run: |
          python -u scanner.py

      - name: Tes koneksi Telegram
        if: always()
        run: |
          python - <<'PY'
          import os
          import requests

          token = os.environ.get("TELEGRAM_BOT_TOKEN")
          chat_id = os.environ.get("TELEGRAM_CHAT_ID")

          if not token:
              raise SystemExit("ERROR: TELEGRAM_BOT_TOKEN kosong.")

          if not chat_id:
              raise SystemExit("ERROR: TELEGRAM_CHAT_ID kosong.")

          url = f"https://api.telegram.org/bot{token}/sendMessage"

          response = requests.post(
              url,
              json={
                  "chat_id": chat_id,
                  "text": "TES BEI AUTO SCANNER: Koneksi Telegram berhasil."
              },
              timeout=20
          )

          print("HTTP:", response.status_code)
          print("HASIL:", response.text)

          response.raise_for_status()

          result = response.json()

          if not result.get("ok"):
              raise SystemExit("Telegram menolak pengiriman pesan.")

          print("BERHASIL: Pesan tes diterima oleh Telegram API.")
          PY

      - name: Simpan riwayat alert
        if: success()
        run: |
          if [ -d data ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A data/

            if ! git diff --cached --quiet; then
              git commit -m "Update scanner alert state"
              git push
            else
              echo "Tidak ada perubahan riwayat alert."
            fi
          else
            echo "Folder data belum tersedia. Tidak ada riwayat yang disimpan."
          fi
